name: wakewise
description: WakeWise is a modern alarm clock app for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  alarm: 5.15.0
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^12.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  sensors_plus: 6.1.2
  pedometer: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
